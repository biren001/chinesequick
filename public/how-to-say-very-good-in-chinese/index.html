<!DOCTYPE html>
<!-- cq-redirect-stub -->
<!-- 由 data/legacy-redirects.json 生成（_dev/make-redirect-stubs.js），不要手改。
     这条 URL 已下线（很好 让位给 不好意思，已删。同为泛用正面评价，用 太棒了 承接。）→ 跳到 /how-to-say-thats-great-in-chinese/
     刻意不加 noindex：noindex 可能让搜索引擎直接丢弃这个 URL 而**不做权重合并**，
     那正是我们要避免的。redirect + canonical 同时给出，两个信号都指向同一个落点。 -->
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 站点「不许浏览器自动翻译」两道声明，缺一条 seocheck 的 allPages.noTranslateMissing 就会报。
     跳转页本身没有 React，理论上不会被翻译搞白屏，但保持一致比给检查开特例省事，
     也避免下次有人照着这个模板抄出一个真的缺声明的页面。 -->
<meta name="google" content="notranslate">
<meta http-equiv="refresh" content="0; url=/how-to-say-thats-great-in-chinese/">
<link rel="canonical" href="https://chinesequick.com/how-to-say-thats-great-in-chinese/">
<title>Moved to That's great | ChineseQuick</title>
</head>
<body>
<p>This page has moved to <a href="/how-to-say-thats-great-in-chinese/">That's great</a>.</p>
</body>
</html>
